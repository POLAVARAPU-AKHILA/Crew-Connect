{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Departments</h2>
    <a href="{% url 'department_create' %}" class="btn btn-success mb-3">+ Add Department</a>
    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Department Name</th>
            </tr>
        </thead>
        <tbody>
            {% for dept in departments %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ dept.name }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
