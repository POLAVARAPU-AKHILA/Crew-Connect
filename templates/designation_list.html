{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Designations</h2>
    <a href="{% url 'designation_create' %}" class="btn btn-success mb-3">+ Add Designation</a>
    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Designation Name</th>
            </tr>
        </thead>
        <tbody>
            {% for des in designations %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ des.name }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
